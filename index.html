<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parlement van de Straat. Waarden</title>
<style>
  :root{
    --bg:#f4f2ec; --panel:#ffffff; --panel2:#ece9df; --line:#111111; --hair:#d8d4c6;
    --text:#111111; --muted:#6b6b62; --ink:#111111; --red:#9c2f22; --green:#3c6b34;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Helvetica Neue',-apple-system,BlinkMacSystemFont,Arial,sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:0 0 70px;}
  .wrap.screen{max-width:1500px;}
  .navbar{background:#111;padding:20px 18px;}
  .navbar-inner{max-width:1500px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .brand-label{font-size:13px;letter-spacing:0.32em;text-transform:uppercase;color:#fff;font-weight:800;}
  .sub-label{margin-top:6px;font-size:20px;font-weight:800;text-transform:uppercase;color:#fff;letter-spacing:0.02em;}
  .status-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#cfcac0;}
  .role-badge{display:inline-block;padding:4px 10px;border:1.5px solid #fff;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;margin-top:10px;color:#fff;}
  .content-pad{padding:22px 18px 0;}
  .panel{background:var(--panel);border:1.5px solid var(--line);padding:22px;margin-bottom:18px;}
  .section-label{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:800;}
  .body-text{font-size:14px;line-height:1.65;color:#2a2a26;margin:0 0 10px;}
  .big{font-size:22px;font-weight:800;text-transform:uppercase;margin:0 0 8px;}
  input[type=text],textarea,select{width:100%;background:var(--panel2);border:1.5px solid var(--line);color:var(--text);padding:12px;font-size:16px;font-family:inherit;margin-bottom:8px;border-radius:0;}
  textarea{resize:vertical;font-size:13px;}
  .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;background:#111;color:#fff;border:1.5px solid #111;padding:14px 18px;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;width:100%;border-radius:0;}
  .btn-primary:disabled{opacity:0.45;cursor:default;}
  .btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--text);border:1.5px solid var(--line);padding:10px 14px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;border-radius:0;}
  .btn-secondary.on{background:#111;color:#fff;}
  .btn-secondary:disabled{opacity:0.45;cursor:default;}
  .btn-danger{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--red);border:1.5px solid var(--red);padding:10px 14px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;border-radius:0;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:10px 12px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;}
  .chip.sel{background:#111;color:#fff;}
  .chip.locked{background:#111;color:#fff;opacity:0.6;cursor:default;}
  .msg{font-size:13px;margin-top:8px;color:var(--muted);}
  .msg.err{color:var(--red);font-weight:700;}
  .msg.ok{color:var(--green);font-weight:700;}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .tile .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:6px;}
  .tile img,.imgbox img{width:100%;display:block;border:1.5px solid var(--line);}
  .ph{aspect-ratio:3/2;border:1.5px dashed var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:14px;}
  .stat{font-size:18px;font-weight:800;line-height:1.4;}
  .stat small{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;}
  .legend span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;display:inline-block;border:1px solid var(--line);}
  svg text{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;}
  .controls.hidden{display:none;}
  .toggle-fab{position:fixed;right:14px;bottom:14px;background:#111;color:#fff;border:none;padding:10px 14px;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;opacity:0.55;}
  .toggle-fab:hover{opacity:1;}
  .qrbox{text-align:center;padding:10px 0;}
  .qrbox img{border:1.5px solid var(--line);}
  .url-text{font-family:'Courier New',monospace;font-size:12px;word-break:break-all;color:var(--muted);margin-top:8px;}
  .tag{display:inline-block;border:1.5px solid var(--line);padding:4px 8px;font-size:11px;font-weight:800;text-transform:uppercase;margin:0 6px 6px 0;}
  .tag button{border:none;background:none;font-weight:800;cursor:pointer;margin-left:4px;}
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ======== CONFIGURATIE ========
   Plak hier de webapp URL van je Apps Script implementatie (eindigt op /exec). */
const BACKEND_URL = "https://script.google.com/macros/s/AKfycby1igVEdhYn7J-IyhpSZZVq_tajygWoShmJjHofR05n0YLHn-3LaJ1wJDd5XKP4XUzA/exec";
const VERSION = "w1";
/* ================================ */

const params = new URLSearchParams(location.search);
const isScreen = params.has("regie");
const presetRole = params.get("role");

const ROLE_COLORS = {
  auto:"#b8863b", parkeer:"#9c7a4a", fiets:"#4f7942", voetganger:"#6b8f9c", kind:"#c96a4f", boom:"#3f7d5c",
  ov:"#5b7ea6", nooddienst:"#a13d2e", winkelier:"#8a7a5c", beperking:"#7a6b9c", regenwater:"#3a7fa8", lucht:"#7fb0c4"
};
const COAL_COLORS = ["#111111","#4f7942","#a13d2e","#5b7ea6","#b8863b","#7a6b9c","#3f7d5c","#c96a4f"];
const ROUND_TITLES = {
  1: "Ronde 1. De bestaande orde",
  2: "Ronde 2. Dezelfde woorden, gelijk gewogen",
  3: "Ronde 3. Coalities"
};

let admin = null;
let words = [];
let coalitions = [];

/* ---------- gedeelde hulpfuncties ---------- */
function esc(s){ if(s===undefined||s===null) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function roleName(id){ const r=(admin&&admin.roles||[]).find(x=>x.id===id); return r?r.name:id; }
function configMissing(){ return !BACKEND_URL || BACKEND_URL.indexOf("PLAK_HIER")===0; }
async function apiGet(qs){ const r=await fetch(BACKEND_URL+(qs?("?"+qs):"")); return r.json(); }
async function apiPost(body){ const r=await fetch(BACKEND_URL,{method:"POST",body:JSON.stringify(body)}); return r.json(); }
function showFatal(title,text){
  document.getElementById("app").innerHTML = `<div class="wrap"><div class="content-pad"><div class="panel"><div class="section-label">${esc(title)}</div><p class="body-text">${esc(text)}</p></div></div></div>`;
}

let participantId = localStorage.getItem("pvds_pid");
if(!participantId){ participantId="p_"+Math.random().toString(36).slice(2,10); localStorage.setItem("pvds_pid",participantId); }

/* ======================================================================
   TELEFOON
   ====================================================================== */
let selectedRole = presetRole || localStorage.getItem("pvds2_role") || null;
let phoneSig = "";
let coalSel = new Set();
let phoneMsg = { text:"", cls:"" };

function lsKey(k){ return "pvds2_"+k+"_"+admin.epoch; }
function handleEpoch(){
  const ep=String(admin.epoch||0);
  if(localStorage.getItem("pvds2_epoch")!==ep){
    Object.keys(localStorage).forEach(k=>{ if(k.indexOf("pvds2_")===0 && k!=="pvds2_epoch") localStorage.removeItem(k); });
    localStorage.setItem("pvds2_epoch",ep);
    if(!presetRole) selectedRole=null;
    coalSel=new Set();
  }
}
async function phoneTick(){
  if(configMissing()){ showFatal("Configuratie ontbreekt","Vul in het HTML bestand de BACKEND_URL in."); return; }
  try{
    const d=await apiGet("lite=1");
    if(!d.admin) throw new Error(d.error||"geen antwoord");
    admin=d.admin;
  }catch(e){
    if(!admin){ showFatal("Geen verbinding","Kan de server niet bereiken. Controleer je verbinding en ververs de pagina."); }
    return;
  }
  handleEpoch();
  const sig=[admin.epoch,admin.phase,admin.round,selectedRole].join("|");
  if(sig!==phoneSig){ phoneSig=sig; renderPhone(); }
}
function pickRole(id){ selectedRole=id; localStorage.setItem("pvds2_role",id); coalSel=new Set(); phoneSig=""; phoneMsg={text:"",cls:""}; phoneTick(); }
function changeRole(){ selectedRole=null; localStorage.removeItem("pvds2_role"); phoneSig=""; renderPhone(); }

function savedWords(round){
  try{ return JSON.parse(localStorage.getItem(lsKey("words"+round))||"[]"); }catch(e){ return []; }
}
function savedCoalition(){ return localStorage.getItem(lsKey("coal"))||""; }

function renderPhone(){
  const app=document.getElementById("app");
  if(!selectedRole){
    app.innerHTML=`<div class="wrap"><div class="navbar"><div class="navbar-inner"><div><div class="brand-label">Parlement van de Straat</div></div></div></div>
      <div class="content-pad"><div class="panel"><div class="section-label">Kies je rol</div>
      <div class="chips">${admin.roles.map(r=>`<div class="chip" onclick="pickRole('${r.id}')">${esc(r.name)}</div>`).join("")}</div></div></div></div>`;
    return;
  }
  const role=admin.roles.find(r=>r.id===selectedRole);
  let body="";
  const open=admin.phase==="open";

  if(admin.phase==="wait"){
    body=`<div class="panel"><div class="section-label">Even wachten</div><p class="body-text">De sessie begint zo. Houd het scherm vooraan in de gaten.</p></div>`;
  } else if(admin.round===2){
    body=`<div class="panel"><div class="section-label">Ronde 2</div><p class="big">Kijk naar het scherm</p><p class="body-text">Dezelfde woorden, nu met gelijk gewicht per rol. Er hoeft niets ingevuld te worden.</p></div>`;
  } else if(admin.round===1){
    body=wordsPanel(1, open,
      "Ronde 1. Wat telt voor jouw rol",
      "Geef drie woorden die waarden uitdrukken. Wat moet deze straat vanuit jouw rol dienen? Bijvoorbeeld veiligheid, snelheid, schaduw.");
  } else if(admin.round===3){
    const coal=savedCoalition();
    const others=admin.roles.filter(r=>r.id!==selectedRole);
    body=`<div class="panel"><div class="section-label">Ronde 3. Stap 1, sluit een coalitie</div>
      <p class="body-text">Overleg in de zaal met andere rollen en kies met welke rollen jullie samengaan. Kies er minstens één, liefst twee.</p>
      <div class="chips"><div class="chip locked">${esc(role.name)}</div>
      ${others.map(r=>`<div class="chip ${coalSel.has(r.id)?'sel':''}" onclick="toggleCoal('${r.id}')">${esc(r.name)}</div>`).join("")}</div>
      <button class="btn-primary" style="margin-top:14px;" ${open?"":"disabled"} onclick="saveCoalition()">Leg coalitie vast</button>
      ${coal?`<p class="msg ok">Jullie coalitie: ${esc(coal.split("|").map(roleName).join(", "))}</p>`:""}
    </div>`+ (coal ? wordsPanel(3, open,
      "Ronde 3. Stap 2, jullie gedeelde waarden",
      "Welke waarden delen jullie in deze coalitie voor de straat? Geef drie woorden waar jullie het samen over eens zijn.") : "");
  }
  app.innerHTML=`<div class="wrap"><div class="navbar"><div class="navbar-inner"><div>
      <div class="brand-label">Parlement van de Straat</div>
      <span class="role-badge">${esc(role?role.name:selectedRole)}</span>
      </div></div></div>
      <div class="content-pad">${body}
      <p class="msg" style="text-align:center;"><a href="#" onclick="changeRole();return false;" style="color:var(--muted);">Andere rol kiezen</a></p></div></div>`;
}

function wordsPanel(round, open, title, text){
  const saved=savedWords(round);
  const inputs=[0,1,2].map(i=>`<input type="text" id="w${i}" maxlength="24" autocomplete="off" placeholder="Woord ${i+1}" value="${esc(saved[i]||"")}" ${open?"":"disabled"}>`).join("");
  const state = open ? (saved.length ? `<p class="msg ok">Verstuurd. Je kunt nog aanpassen en opnieuw versturen.</p>` : "")
                     : `<p class="msg">De invoer is gesloten. Kijk naar het scherm.</p>`;
  return `<div class="panel"><div class="section-label">${esc(title)}</div><p class="body-text">${esc(text)}</p>
    ${inputs}
    <button class="btn-primary" id="btn-send" ${open?"":"disabled"} onclick="sendWords(${round})">Verstuur woorden</button>
    ${state}<p class="msg ${phoneMsg.cls}" id="phone-msg">${esc(phoneMsg.text)}</p></div>`;
}

function toggleCoal(id){
  if(coalSel.has(id)) coalSel.delete(id); else coalSel.add(id);
  renderPhone();
}
async function saveCoalition(){
  if(coalSel.size<1){ phoneMsg={text:"Kies minstens één andere rol.",cls:"err"}; renderPhone(); return; }
  const key=[selectedRole].concat(Array.from(coalSel)).sort().join("|");
  try{
    const r=await apiPost({action:"coalition",participantId,roleId:selectedRole,coalition:key});
    if(!r.ok) throw new Error(r.error||"mislukt");
    localStorage.setItem(lsKey("coal"),key);
    phoneMsg={text:"",cls:""};
  }catch(e){ phoneMsg={text:"Opslaan mislukt, probeer het opnieuw.",cls:"err"}; }
  renderPhone();
}
async function sendWords(round){
  const vals=[0,1,2].map(i=>(document.getElementById("w"+i).value||"").trim()).filter(Boolean);
  if(!vals.length){ phoneMsg={text:"Vul minstens één woord in.",cls:"err"}; renderPhone(); return; }
  const btn=document.getElementById("btn-send"); if(btn){ btn.disabled=true; btn.textContent="Versturen"; }
  try{
    const r=await apiPost({action:"words",round,roleId:selectedRole,participantId,words:vals,coalition: round===3?savedCoalition():""});
    if(!r.ok) throw new Error(r.error||"mislukt");
    localStorage.setItem(lsKey("words"+round),JSON.stringify(vals));
    phoneMsg={text:"",cls:""};
  }catch(e){ phoneMsg={text:(e.message&&e.message.indexOf("gesloten")>=0)?"De invoer is gesloten.":"Versturen mislukt, probeer het opnieuw.",cls:"err"}; }
  renderPhone();
}

/* ======================================================================
   REGIESCHERM
   ====================================================================== */
let present=false, compare=false, promptEdited={}, promptStore={}, imgCache={}, imgBusy=false;
let mainSig="", ctrlSig="", pollBusy=false;

function normWord(w){ return String(w||"").toLowerCase().replace(/[^a-z0-9à-ÿ ]/g,"").replace(/\s+/g," ").trim().slice(0,24); }

function latestSubmissions(round){
  const best={};
  words.forEach(r=>{ if(Number(r.round)!==round) return; const p=r.participantId; if(best[p]===undefined||r.ts>best[p]) best[p]=r.ts; });
  return words.filter(r=>Number(r.round)===round && r.ts===best[r.participantId]);
}

function computeWeights(round){
  const hidden=new Set(admin.hidden||[]);
  const src = round===3 ? 3 : 1;
  const subs=latestSubmissions(src).filter(r=>!hidden.has(r.word));
  const groupOf = r => round===3 ? String(r.coalition||"zonder coalitie") : String(r.roleId);
  const groups={};
  subs.forEach(r=>{ const g=groupOf(r); (groups[g]=groups[g]||[]).push(r); });
  const gKeys=Object.keys(groups);
  const totalSeats=admin.roles.reduce((a,r)=>a+r.seats1,0);
  const voice = g => {
    if(round===1) return (admin.roles.find(r=>r.id===g)||{seats1:1}).seats1;
    if(round===2) return totalSeats/Math.max(1,gKeys.length);
    return g.split("|").length;
  };
  const map={};
  gKeys.forEach(g=>{
    const rows=groups[g], v=voice(g)/rows.length;
    rows.forEach(r=>{
      const it=map[r.word]||(map[r.word]={word:r.word,weight:0,parts:{}});
      it.weight+=v; it.parts[g]=(it.parts[g]||0)+v;
    });
  });
  const items=Object.values(map).sort((a,b)=>b.weight-a.weight);
  const total=items.reduce((a,i)=>a+i.weight,0);
  const participants=new Set(subs.map(r=>r.participantId)).size;
  const sortedCoal=gKeys.slice().sort();
  items.forEach(it=>{
    let top=null,tv=-1; Object.keys(it.parts).forEach(g=>{ if(it.parts[g]>tv){tv=it.parts[g];top=g;} });
    it.top=top;
    it.color = round===3 ? COAL_COLORS[sortedCoal.indexOf(top)%COAL_COLORS.length] : (ROLE_COLORS[top]||"#111");
  });
  return {items,total,participants,groups:gKeys,sortedCoal};
}
function motorShare(res){
  if(!res.total) return null;
  let m=0; res.items.forEach(it=>{ m+=(it.parts.auto||0)+(it.parts.parkeer||0); });
  return Math.round(m/res.total*100);
}

function overlap(a,b){ return !(a.x+a.w+6<b.x || b.x+b.w+6<a.x || a.y+a.h+4<b.y || b.y+b.h+4<a.y); }
function layoutCloud(items,W,H){
  const ctx=document.createElement("canvas").getContext("2d");
  const placed=[], out=[];
  if(!items.length) return out;
  const wmax=items[0].weight;
  items.forEach(it=>{
    let size=16+88*Math.pow(it.weight/wmax,0.75);
    for(let attempt=0;attempt<14;attempt++){
      ctx.font="800 "+size+"px Helvetica Neue, Arial, sans-serif";
      const w=ctx.measureText(it.word).width+8, h=size*1.02;
      let pos=null;
      for(let t=0;t<2600;t++){
        const a=t*0.33, r=1+t*0.2;
        const x=W/2+r*Math.cos(a)*1.7, y=H/2+r*Math.sin(a);
        const box={x:x-w/2,y:y-h/2,w:w,h:h};
        if(box.x<4||box.y<4||box.x+w>W-4||box.y+h>H-4) continue;
        let hit=false; for(let i=0;i<placed.length;i++){ if(overlap(placed[i],box)){hit=true;break;} }
        if(!hit){pos=box;break;}
      }
      if(pos){ placed.push(pos); out.push({word:it.word,color:it.color,size:size,x:pos.x+pos.w/2,y:pos.y+pos.h/2}); break; }
      size*=0.88;
    }
  });
  return out;
}
function cloudSvg(res){
  const W=1000,H=560;
  const laid=layoutCloud(res.items.slice(0,40),W,H);
  const t=laid.map(w=>`<text data-word="${esc(w.word)}" x="${w.x.toFixed(1)}" y="${w.y.toFixed(1)}" font-size="${w.size.toFixed(1)}" fill="${w.color}" text-anchor="middle" dominant-baseline="central" style="cursor:${present?'default':'pointer'}">${esc(w.word)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${t}</svg>`;
}
function cloudLegend(res,round){
  if(round===3){
    return `<div class="legend">${res.sortedCoal.map((g,i)=>`<span><i style="background:${COAL_COLORS[i%COAL_COLORS.length]}"></i>${esc(g.split("|").map(roleName).join(" + "))}</span>`).join("")}</div>`;
  }
  const used=new Set(res.groups);
  return `<div class="legend">${admin.roles.filter(r=>used.has(r.id)).map(r=>`<span><i style="background:${ROLE_COLORS[r.id]||'#111'}"></i>${esc(r.name)}${round===1?" ("+r.seats1+"z)":""}</span>`).join("")}</div>`;
}

function buildPrompt(res){
  const top=res.items.slice(0,12);
  const sum=top.reduce((a,i)=>a+i.weight,0)||1;
  const list=top.map(i=>`${i.word} (${Math.round(i.weight/sum*100)}%)`).join(", ");
  return "Edit this photo of a Dutch street. Keep the same camera position, the same buildings and the same perspective. Photorealistic, daytime, no text or labels in the image. Redesign the street so that it expresses the following values. The percentage shows how strongly each value must determine the design: the highest percentages must clearly dominate the layout and use of space, the lowest appear only subtly. The values are Dutch words, interpret their meaning: "+list+".";
}

async function loadImage(key){
  const id = key==="base" ? admin.baseImage : (admin.images||{})[key];
  if(!id){ delete imgCache[key]; return; }
  if(imgCache[key] && imgCache[key].id===id) return;
  imgCache[key]={id:id,url:null,loading:true};
  try{
    const d=await apiGet("image="+encodeURIComponent(key));
    if(d.ok){ imgCache[key]={id:id,url:"data:"+d.mime+";base64,"+d.b64}; }
    else delete imgCache[key];
  }catch(e){ delete imgCache[key]; }
  mainSig=""; updateMain();
}
function imgTag(key,label){
  const c=imgCache[key];
  if(c&&c.url) return `<img src="${c.url}" alt="${esc(label)}">`;
  const id = key==="base" ? admin.baseImage : (admin.images||{})[key];
  return `<div class="ph">${id?"Beeld wordt geladen":"Nog geen beeld"}</div>`;
}

function currentResult(){ return computeWeights(admin.round); }

function updateHeader(){
  const el=document.getElementById("rg-head"); if(!el) return;
  const res=currentResult();
  const stat = admin.phase==="open" ? "Invoer open" : admin.phase==="closed" ? "Invoer gesloten" : "Wachten";
  el.innerHTML=`<div><div class="brand-label">Parlement van de Straat &middot; ${VERSION}</div><div class="sub-label">${esc(ROUND_TITLES[admin.round])}</div></div>
    <div class="status-label">${stat}${admin.round!==2?` &middot; ${res.participants} deelnemers`:""}</div>`;
}

function updateMain(){
  const el=document.getElementById("rg-main"); if(!el) return;
  ["base","1","2","3"].forEach(k=>loadImage(k));
  const res=currentResult();
  const sig=JSON.stringify([admin.round,compare,present,res.items.slice(0,40).map(i=>[i.word,Math.round(i.weight*100)]),
    ["base","1","2","3"].map(k=>imgCache[k]&&imgCache[k].url?1:0), admin.baseImage, JSON.stringify(admin.images), imgBusy]);
  if(sig===mainSig) return;
  mainSig=sig;

  if(compare){
    const tiles=[["base","Beginstraat"],["1","Ronde 1. Bestaande orde"],["2","Ronde 2. Gelijke weging"],["3","Ronde 3. Coalities"]];
    el.innerHTML=`<div class="grid4">${tiles.map(t=>`<div class="panel tile"><div class="lab">${t[1]}</div>${imgTag(t[0],t[1])}</div>`).join("")}</div>`;
    return;
  }
  const url=location.origin+location.pathname;
  let cloudInner;
  if(!res.items.length){
    cloudInner=`<div class="qrbox"><div class="big">Scan en doe mee</div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}" width="260" height="260" alt="QR code">
      <div class="url-text">${esc(url)}</div></div>`;
  } else {
    cloudInner=cloudSvg(res)+cloudLegend(res,admin.round);
  }
  const imgKey=String(admin.round);
  const imgInner = imgBusy ? `<div class="ph">Het beeld wordt gemaakt, dit duurt ongeveer een minuut</div>` : imgTag(imgKey,"Beeld ronde "+admin.round);
  el.innerHTML=`<div class="grid"><div class="panel"><div class="section-label">Waarden, gewogen</div>${cloudInner}</div>
    <div class="panel imgbox"><div class="section-label">Beeld van de straat, ronde ${admin.round}</div>${imgInner}</div></div>`;
  const cl=el.querySelector("svg");
  if(cl) cl.addEventListener("click",ev=>{ const t=ev.target.closest("[data-word]"); if(t && !present) hideWord(t.dataset.word); });
}

function updateStats(){
  const el=document.getElementById("rg-stats"); if(!el) return;
  const r1=computeWeights(1), r2=computeWeights(2), r3=computeWeights(3);
  const m1=motorShare(r1), m2=motorShare(r2);
  let html="";
  if(admin.round===1 && m1!==null) html=`<div class="stat"><small>Aandeel van de auto en de geparkeerde auto in het totale gewicht</small>${m1}%</div>`;
  else if(admin.round===2 && m1!==null && m2!==null) html=`<div class="stat"><small>Aandeel van de auto en de geparkeerde auto, ronde 1 naar ronde 2</small>${m1}% &rarr; ${m2}%</div>`;
  else if(admin.round===3) html=`<div class="stat"><small>Coalities en deelnemers</small>${r3.groups.length} coalities, ${r3.participants} deelnemers</div>`;
  el.innerHTML = html ? `<div class="panel" style="padding:16px 22px;">${html}</div>` : "";
}

function updateControls(){
  [1,2,3].forEach(n=>{ const b=document.getElementById("btn-r"+n); if(b) b.classList.toggle("on",admin.round===n); });
  const bo=document.getElementById("btn-open"), bc=document.getElementById("btn-close");
  if(bo) bo.classList.toggle("on",admin.phase==="open");
  if(bc) bc.classList.toggle("on",admin.phase==="closed");
  const inputRound=admin.round!==2;
  if(bo) bo.disabled=!inputRound; if(bc) bc.disabled=!inputRound;
  const gb=document.getElementById("btn-gen"); if(gb){ gb.textContent="Maak beeld voor ronde "+admin.round; gb.disabled=imgBusy||!admin.baseImage; }
  const bs=document.getElementById("base-state"); if(bs) bs.textContent=admin.baseImage?"Beginstraat staat klaar.":"Nog geen beginstraat.";

  const hid=document.getElementById("hidden-list");
  if(hid){ const h=admin.hidden||[]; hid.innerHTML = h.length ? h.map(w=>`<span class="tag">${esc(w)}<button onclick="unhideWord('${esc(w)}')">terugzetten</button></span>`).join("") : `<span class="msg">Geen verborgen woorden. Klik op een woord in de wolk om het te verbergen.</span>`; }

  const cl=document.getElementById("coal-list");
  if(cl){
    if(admin.round!==3){ cl.innerHTML=`<span class="msg">Alleen relevant in ronde 3.</span>`; }
    else{
      const latest={}; coalitions.forEach(c=>{ if(!latest[c.participantId]||c.ts>latest[c.participantId].ts) latest[c.participantId]=c; });
      const cnt={}; Object.values(latest).forEach(c=>{ cnt[c.coalition]=(cnt[c.coalition]||0)+1; });
      const keys=Object.keys(cnt).sort();
      cl.innerHTML = keys.length ? keys.map(k=>`<span class="tag">${esc(k.split("|").map(roleName).join(" + "))} (${cnt[k]})</span>`).join("") : `<span class="msg">Nog geen coalities vastgelegd.</span>`;
    }
  }
  const ta=document.getElementById("prompt-text");
  if(ta){
    const key=String(admin.round);
    const res=currentResult();
    const auto=buildPrompt(res);
    if(!promptEdited[key]){ if(document.activeElement!==ta && ta.value!==auto) ta.value=res.items.length?auto:""; promptStore[key]=ta.value; }
    else if(document.activeElement!==ta){ ta.value=promptStore[key]; }
  }
}

async function poll(){
  if(pollBusy) return; pollBusy=true;
  try{
    const d=await apiGet("");
    if(d.admin){ admin=d.admin; words=d.words||[]; coalitions=d.coalitions||[]; }
    else throw new Error(d.error||"geen antwoord");
    const el=document.getElementById("rg-status-err"); if(el) el.textContent="";
    updateHeader(); updateMain(); updateStats(); updateControls();
  }catch(e){
    const el=document.getElementById("rg-status-err"); if(el) el.textContent="Geen verbinding met de server, nieuwe poging volgt.";
  }
  pollBusy=false;
}

async function setRound(n){ await apiPost({action:"admin_update",patch:{round:n,phase:"wait"}}); compare=false; poll(); }
async function setPhase(p){ await apiPost({action:"admin_update",patch:{phase:p}}); poll(); }
async function hideWord(w){ const h=(admin.hidden||[]).concat([w]); await apiPost({action:"admin_update",patch:{hidden:h}}); poll(); }
async function unhideWord(w){ const h=(admin.hidden||[]).filter(x=>x!==w); await apiPost({action:"admin_update",patch:{hidden:h}}); poll(); }
function toggleCompare(){ compare=!compare; mainSig=""; updateMain(); const b=document.getElementById("btn-compare"); if(b) b.classList.toggle("on",compare); }
function togglePresent(){
  present=!present; mainSig="";
  document.getElementById("rg-controls").classList.toggle("hidden",present);
  document.getElementById("rg-fab").textContent = present ? "Bediening" : "Presentatie";
  updateMain();
}
function onPromptInput(el){ const k=String(admin.round); promptEdited[k]=true; promptStore[k]=el.value; }
function resetPrompt(){ const k=String(admin.round); promptEdited[k]=false; updateControls(); }

async function resetAll(){
  if(!confirm("Alles wissen en opnieuw beginnen? Woorden, coalities en alle gemaakte beelden verdwijnen, en alle telefoons kiezen opnieuw een rol. De beginstraat blijft staan.")) return;
  await apiPost({action:"reset_all"});
  imgCache={}; promptEdited={}; promptStore={}; compare=false; mainSig="";
  poll();
}

function loadFile(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=fr.result; };
    fr.onerror=reject; fr.readAsDataURL(file);
  });
}
async function uploadBase(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const msg=document.getElementById("base-msg"); msg.textContent="Bezig met uploaden"; msg.className="msg";
  try{
    const img=await loadFile(f);
    const maxW=1536, sc=Math.min(1,maxW/img.width);
    const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const b64=c.toDataURL("image/jpeg",0.86).split(",")[1];
    const r=await apiPost({action:"set_base",b64:b64,mime:"image/jpeg"});
    if(!r.ok) throw new Error(r.error||"mislukt");
    msg.textContent="Beginstraat staat klaar."; msg.className="msg ok";
    delete imgCache["base"]; mainSig=""; poll();
  }catch(e){ msg.textContent="Uploaden mislukt: "+(e.message||"onbekende fout"); msg.className="msg err"; }
  input.value="";
}

async function generate(){
  const round=admin.round;
  const prompt=document.getElementById("prompt-text").value.trim();
  const msg=document.getElementById("gen-msg");
  if(!prompt){ msg.textContent="Er zijn nog geen woorden, dus de prompt is leeg."; msg.className="msg err"; return; }
  imgBusy=true; msg.textContent="Het beeld wordt gemaakt. Dit duurt ongeveer een minuut."; msg.className="msg"; mainSig=""; updateMain(); updateControls();
  try{
    const r=await apiPost({action:"generate_image",round:round,prompt:prompt});
    if(!r.ok) throw new Error(r.error||"mislukt");
    imgCache[String(round)]={id:r.id,url:"data:"+r.mime+";base64,"+r.b64};
    msg.textContent="Beeld klaar."; msg.className="msg ok";
  }catch(e){ msg.textContent="Mislukt: "+(e.message||"onbekende fout"); msg.className="msg err"; }
  imgBusy=false; mainSig=""; await poll();
}

function renderRegie(){
  if(configMissing()){ showFatal("Configuratie ontbreekt","Vul in het HTML bestand de BACKEND_URL in."); return; }
  const url=location.origin+location.pathname;
  document.getElementById("app").innerHTML=`
  <div class="wrap screen">
    <div class="navbar"><div class="navbar-inner" id="rg-head"><div class="brand-label">Parlement van de Straat</div></div></div>
    <div class="content-pad">
      <div id="rg-main"></div>
      <div id="rg-stats"></div>
      <div id="rg-controls" class="controls">
        <div class="panel">
          <div class="section-label">Ronde en invoer</div>
          <div class="row">
            <button class="btn-secondary" id="btn-r1" onclick="setRound(1)">Ronde 1</button>
            <button class="btn-secondary" id="btn-r2" onclick="setRound(2)">Ronde 2</button>
            <button class="btn-secondary" id="btn-r3" onclick="setRound(3)">Ronde 3</button>
            <span style="width:18px"></span>
            <button class="btn-secondary" id="btn-open" onclick="setPhase('open')">Open invoer</button>
            <button class="btn-secondary" id="btn-close" onclick="setPhase('closed')">Sluit invoer</button>
            <span style="width:18px"></span>
            <button class="btn-secondary" id="btn-compare" onclick="toggleCompare()">Vergelijk alle beelden</button>
          </div>
          <p class="msg">Ronde 2 gebruikt de woorden van ronde 1. Bij het wisselen van ronde staat de invoer eerst dicht.</p>
        </div>
        <div class="grid">
          <div class="panel">
            <div class="section-label">Beginstraat</div>
            <input type="file" accept="image/*" onchange="uploadBase(this)">
            <p class="msg" id="base-state"></p><p class="msg" id="base-msg"></p>
            <div class="section-label" style="margin-top:14px;">Beeld maken met AI</div>
            <textarea id="prompt-text" rows="7" oninput="onPromptInput(this)" placeholder="De prompt wordt opgebouwd uit de zwaarst gewogen woorden"></textarea>
            <div class="row">
              <button class="btn-primary" id="btn-gen" style="width:auto;" onclick="generate()">Maak beeld</button>
              <button class="btn-secondary" onclick="resetPrompt()">Prompt opnieuw opbouwen</button>
            </div>
            <p class="msg" id="gen-msg"></p>
          </div>
          <div class="panel">
            <div class="section-label">Verborgen woorden</div>
            <div id="hidden-list"></div>
            <div class="section-label" style="margin-top:14px;">Coalities (ronde 3)</div>
            <div id="coal-list"></div>
            <div class="section-label" style="margin-top:14px;">Scan om mee te doen</div>
            <div class="qrbox" style="text-align:left;padding:0;">
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url)}" width="140" height="140" alt="QR code">
              <div class="url-text">${esc(url)}</div>
            </div>
            <p class="msg err" id="rg-status-err"></p>
            <div style="margin-top:14px;"><button class="btn-danger" onclick="resetAll()">Opnieuw beginnen</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <button class="toggle-fab" id="rg-fab" onclick="togglePresent()">Presentatie</button>`;
  poll();
  setInterval(poll,3000);
}

/* ---------- start ---------- */
if(isScreen){ renderRegie(); }
else { phoneTick(); setInterval(phoneTick,5000); }
</script>
